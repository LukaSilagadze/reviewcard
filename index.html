<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b5cff" />

    <title>შეფასების ბარათი და გუგლის შეფასების დასადგამი | ReviewCard</title>
    <meta name="description" content="შეფასების ბარათი და გუგლის შეფასების დასადგამი შენი ბიზნესისთვის — NFC ტექნოლოგია, რომელიც ერთი შეხებით ხსნის Google შეფასების გვერდს. მიწოდება მთელ საქართველოში." />
    <link rel="canonical" href="https://www.reviewcard.ge/" />
    <meta property="og:title" content="შეფასების ბარათი და გუგლის შეფასების დასადგამი | ReviewCard" />
    <meta property="og:description" content="შეფასების ბარათი და გუგლის შეფასების დასადგამი — NFC ბარათები და დასადგამები მეტი Google შეფასებისთვის." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.reviewcard.ge/" />
    <meta property="og:image" content="https://www.reviewcard.ge/assets/hero1.webp" />

    <link rel="icon" href="/assets/icon.png" />

    <!-- Loaded here rather than via @import in the stylesheet, so the fonts
         download in parallel with the CSS instead of after it. Only the three
         weights the stylesheet actually uses are requested. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&family=Noto+Sans+Georgian:wght@400;700;800&display=swap"
    />
    <!-- The hero background is the largest paint on the page — preload
         whichever image actually paints first, matching Hero.jsx's own
         breakpoint (below it the carousel switches to customer-gallery
         photos instead of the wide product shots). -->
    <link rel="preload" as="image" href="/assets/hero1.webp" media="(min-width: 601px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/assets/customer-gallery/dekaroom.webp" media="(max-width: 600px)" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "ReviewCard",
        "url": "https://www.reviewcard.ge/",
        "logo": "https://www.reviewcard.ge/assets/icon.png",
        "description": "შეფასების ბარათი და გუგლის შეფასების დასადგამი ბიზნესებისთვის — NFC ტექნოლოგია, მიწოდება მთელ საქართველოში.",
        "areaServed": "GE",
        "email": "reviewcard0@gmail.com",
        "telephone": "+995596160003",
        "sameAs": [
          "https://www.instagram.com/reviewcard_georgia",
          "https://www.facebook.com/profile.php?id=61590586266489",
          "https://www.tiktok.com/@review.card0"
        ]
      }
    </script>
    <!-- Mirrors the Georgian FAQ copy in src/i18n/translations.js — keep both
         in sync, since FAQPage markup must match what's visibly on the page. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "რა არის შეფასების ბარათი?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "შეფასების ბარათი არის NFC ბარათი, რომელსაც კლიენტი ტელეფონით ეხება და ავტომატურად ეხსნება ბიზნესის Google შეფასების გვერდი, რათა მარტივად დატოვოს შეფასება."
            }
          },
          {
            "@type": "Question",
            "name": "რა არის გუგლის შეფასების დასადგამი?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "გუგლის შეფასების დასადგამი არის დახლზე ან მაგიდაზე დასადგმელი NFC დასადგამი კაფეებისა და მაღაზიებისთვის, რომელიც ერთი შეხებით ხსნის ბიზნესის Google შეფასების გვერდს."
            }
          },
          {
            "@type": "Question",
            "name": "როგორ მუშაობს ReviewCard?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "ტელეფონის შეხებით იხსნება მითითებული გვერდი."
            }
          },
          {
            "@type": "Question",
            "name": "ყველა ტელეფონზე მუშაობს?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "მუშაობს თანამედროვე NFC-ის მქონე სმარტფონების უმეტესობაზე."
            }
          },
          {
            "@type": "Question",
            "name": "სჭირდება მომხმარებელს აპლიკაცია?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "არა. დამატებითი აპლიკაცია საჭირო არ არის."
            }
          },
          {
            "@type": "Question",
            "name": "შეიძლება ჩემს ბიზნესზე დაპროგრამება?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "დიახ. თითოეული ReviewCard კონკრეტული ბიზნესისთვის კონფიგურირდება."
            }
          },
          {
            "@type": "Question",
            "name": "თბილისის გარეთ მიგაქვთ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "დიახ. მიწოდება ხელმისაწვდომია მთელ საქართველოში."
            }
          },
          {
            "@type": "Question",
            "name": "როგორ შევუკვეთო?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "მოგვწერე Instagram-ზე, Facebook-ზე ან WhatsApp-ზე."
            }
          }
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Product",
        "name": "შეფასების ბარათი (Google Review Card)",
        "description": "NFC შეფასების ბარათი, რომელიც ერთი შეხებით ხსნის ბიზნესის Google შეფასების გვერდს.",
        "image": "https://www.reviewcard.ge/assets/gw_card.webp",
        "brand": { "@type": "Brand", "name": "ReviewCard" },
        "offers": {
          "@type": "Offer",
          "url": "https://www.reviewcard.ge/#products",
          "priceCurrency": "GEL",
          "price": "40",
          "availability": "https://schema.org/InStock"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Product",
        "name": "გუგლის შეფასების დასადგამი (Google Review Stand)",
        "description": "დახლზე ან მაგიდაზე დასადგმელი NFC დასადგამი, რომელიც ერთი შეხებით ხსნის ბიზნესის Google შეფასების გვერდს.",
        "image": "https://www.reviewcard.ge/assets/gw_stand.webp",
        "brand": { "@type": "Brand", "name": "ReviewCard" },
        "offers": {
          "@type": "Offer",
          "url": "https://www.reviewcard.ge/#products",
          "priceCurrency": "GEL",
          "price": "48",
          "availability": "https://schema.org/InStock"
        }
      }
    </script>
  </body>
</html>
